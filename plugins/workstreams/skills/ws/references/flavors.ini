# Built-in workstream flavors (read-only; bundled with the ws skill).
# User selection + custom flavors live in <store>/flavors.ini.
# See ../SKILL.md "## Flavors" for groups, operations, layers, and resolution.

[worktree-management/wmx]
create                            = wmx worktree create <branch> --base <base> --no-window
remove                            = wmx worktree remove <branch>
locate                            = wmx worktree path <branch>
hook-ws-start-after               = wmx window open <branch>
hook-ws-start-after.prompt        = Open <branch> in a new window? (No = keep working here)
hook-ws-next-after.prompt              = Where should <unit> run?
hook-ws-next-after.choices.skip        =
hook-ws-next-after.choices.skip.desc   = Not now
hook-ws-next-after.choices.here        = <command>
hook-ws-next-after.choices.here.desc   = Here
hook-ws-next-after.choices.window      = wmx window open <branch>
hook-ws-next-after.choices.window.desc = New window

[worktree-management/git-worktree]
create = git worktree add -b <branch> <path> <base>   ; <path> = ../<repo>.worktrees/<branch>
remove = git worktree remove <path>
locate = git worktree list --porcelain

[spec-driven-development/superpowers]
plan      = superpowers:writing-plans
execute   = superpowers:subagent-driven-development
ship      = superpowers:finishing-a-development-branch
spec-glob = *specs/*-design.md
hook-ws-resume-unplanned-before = resolve plan path (SPEC Plan path); set session context for plan op
hook-ws-resume-unplanned-after  = append plan <absolute-path> to log.md when absent; task derivation and execute-mode happen at plan-pause (ws-resume), not here
hook-ws-resume-loop-before      = print orientation (goal, N/M, plan path) from log plan line; skip if absent; in-progress only, once per invocation

[spec-driven-development/none]
plan    = derive tasks from charter + design; write T1.. into progress.md directly
execute = work the first unchecked task directly (TDD if the repo has tests)
ship    = open the PR via the active forge flavor, then mark ready per SPEC

[forge/gh]
default-branch = gh repo view --json defaultBranchRef -q .defaultBranchRef.name
pr-status      = gh pr view <branch> --repo <repo> --json number,isDraft,state,baseRefName
pr-create      = gh pr create --base <base> --head <branch> --draft
pr-ready       = gh pr ready <pr>
pr-retarget    = gh pr edit <pr> --base <new-base>
