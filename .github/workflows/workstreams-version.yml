name: workstreams-version
on:
  pull_request:
    paths:
      - "plugins/workstreams/.claude-plugin/plugin.json"
      - "plugins/workstreams/.claude-plugin/skill-versions.json"
      - "plugins/workstreams/skills/**/SKILL.md"
      - "plugins/workstreams/skills/ws-guide/assets/**"
      - "tools/**"
      - ".github/workflows/workstreams-version.yml"
  push:
    branches: [main]
    paths:
      - "plugins/workstreams/.claude-plugin/plugin.json"
      - "plugins/workstreams/.claude-plugin/skill-versions.json"
      - "plugins/workstreams/skills/**/SKILL.md"
      - "plugins/workstreams/skills/ws-guide/assets/**"
      - "tools/**"
      - ".github/workflows/workstreams-version.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin_version tests
        run: python3 -m unittest discover -s tools/tests
      # Same checks as `just check-plugin-version` and `just
      # check-guide`, calling the one script both delegate to.
      - name: plugin.json matches the skill-version snapshot
        run: python3 tools/plugin_version.py check plugins/workstreams
      - name: Guide stamp matches plugin.json's series
        run: |
          python3 tools/plugin_version.py check-guide \
            plugins/workstreams \
            plugins/workstreams/skills/ws-guide/assets/WORKSTREAMS-GUIDE.html
